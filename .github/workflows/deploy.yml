name: Deploy personal homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css theme.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
