<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Renhao Li favicon</title>
  <desc id="desc">Minimal monogram favicon with the letter L.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --line: #d8d8d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #f5f5f5;
        --line: #3a3a3a;
      }
    }
    .card {
      fill: var(--bg);
      stroke: var(--line);
      stroke-width: 1.5;
    }
    .letter {
      fill: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 38px;
      font-weight: 650;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <rect class="card" x="7" y="7" width="50" height="50" rx="12" ry="12" />
  <text class="letter" x="32" y="33">L</text>
</svg>
